<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lincoln Berto - Tech Lead & Front-End Engineer Hub. Links profissionais, stack e métricas.">
    <title>Lincoln Berto | Tech Hub</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- CSS Mestre -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="container">
        <!-- Header / Profile Section -->
        <header class="profile">
            <div class="profile__avatar-wrapper">
                <img src="./assets/pic-profile.png" alt="Foto de perfil de Lincoln Berto" class="profile__avatar" width="120" height="120">
            </div>

            <div class="profile__info">
                <div class="profile__title-wrapper">
                    <h1 class="profile__name">Lincoln Berto</h1>
                    <span class="profile__badge" aria-label="Perfil verificado" title="Perfil Verificado">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" />
                        </svg>
                    </span>
                </div>
                <p class="profile__role">Front-End Engineer & Tech Lead</p>
                <p class="profile__bio">Construindo interfaces de alta performance e arquiteturas escaláveis.</p>
            </div>
        </header>
    </main>

</html>
